services :
    mariadb:
      restart: on-failure
      image: inception-mariadb:1.0
      build: ./requirements/mariadb
      env_file:
        - .env
      secrets:
        - db_password
        - db_root_password
      volumes:
        - mariadb_data:/var/lib/mysql
      networks:
        - inception

    wordpress:
      restart: on-failure
      image: inception-wordpress:1.0
      build: ./requirements/wordpress
      env_file:
        - .env
      secrets:
        - db_password
        - wp_admin_password
        - wp_user_password
      volumes:
        - wordpress_data:/var/www/html
      networks:
        - inception

    nginx:
      restart: on-failure
      image: inception-nginx:1.0
      build: ./requirements/nginx
      env_file:
        - .env
      volumes:
        - wordpress_data:/var/www/html:ro #read only
      ports:
        - "443:443"
      networks:
        - inception
        
    redis:
      image: inception-redis:1.0
      restart: on-failure
      build: ./requirements/bonus/redis
      networks:
        - inception

    ftp:
      image: inception-ftp:1.0
      restart: on-failure
      build: ./requirements/bonus/ftp
      secrets:
        - ftp_password
      volumes:
        - wordpress_data:/var/www/html
      ports:
        - "21:21"
        - "21100-21110:21100-21110"
      networks:
        - inception

    adminer:
      image: inception-adminer:1.0
      restart: on-failure
      build: ./requirements/bonus/adminer
      networks:
        - inception

    static:
      image: inception-static:1.0
      restart: on-failure
      build: ./requirements/bonus/static
      networks:
          - inception

    backup:
      image: inception-backup:1.0
      restart: on-failure
      build: ./requirements/bonus/backup
      volumes:
          - wordpress_data:/var/www/html:ro
          - backup_data:/backup

volumes:
    mariadb_data:
      driver: local
      driver_opts:
        type: none
        o: bind
        device: /home/reda/data/mariadb

    wordpress_data:
      driver: local
      driver_opts:
        type: none
        o: bind
        device: /home/reda/data/wordpress

    backup_data:
      driver: local
      driver_opts:
          type: none
          o: bind
          device: /home/reda/data/backups

secrets:
    db_password:
      file: ../secrets/db_password.txt

    db_root_password:
      file: ../secrets/db_root_password.txt

    wp_admin_password:
      file: ../secrets/wp_admin_password.txt

    wp_user_password:
      file: ../secrets/wp_user_password.txt

    ftp_password:
      file: ../secrets/ftp_password.txt

networks:
    inception:

