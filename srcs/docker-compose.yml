services :
    mariadb:
      build: ./requirements/mariadb
      env_file:
        - .env
      secrets:
        - db_password
        - db_root_password
      volumes:
        - mariadb_data:/var/lib/mysql

    wordpress:
      build: ./requirements/wordpress

    nginx:
      build: ./requirements/nginx

volumes:
    mariadb_data:
      driver: local
      driver_opts:
        type: none
        o: bind
        device: /home/reda/data/mariadb

secrets:
    db_password:
      file: ../secrets/db_password.txt

    db_root_password:
      file: ../secrets/db_root_password.txt